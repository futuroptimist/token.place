name: Desktop operator app e2e

# Cargo occasionally fails on GitHub-hosted runners with curl HTTP/2
# framing errors while downloading crates during Tauri builds. Disable HTTP
# multiplexing for this workflow and allow extra retries so transient registry
# transport failures do not fail the desktop operator e2e job.
env:
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '10'

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-operator-e2e.yml'
      - 'desktop-tauri/src/**'
      - 'desktop-tauri/src-tauri/src/**'
      - 'desktop-tauri/src-tauri/python/**'
      - 'desktop-tauri/src-tauri/tauri.conf.json'
      - 'desktop-tauri/scripts/test_packaged_operator_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_operator_ui_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_no_relay_autostart_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_relay_operator_parity_e2e.py'
      - 'desktop-tauri/scripts/run_desktop_parity_checks.py'
      - 'desktop-tauri/scripts/test_windows_installer_identity.py'
      - 'tests/unit/test_desktop_release_artifacts.py'
      - 'tests/unit/test_windows_installer_refusal.py'
      - 'desktop-tauri/src-tauri/installers/**'
      - 'tests/unit/test_model_manager.py'
      - 'tests/integration/test_desktop_qwen64k_packaged_runtime.py'
      - 'scripts/long_context_benchmark.py'
      - 'scripts/long_context_benchmark/**'
      - 'scripts/provision-ci-tiny-gguf.sh'
      - 'tests/unit/test_long_context_benchmark_harness.py'
      - 'utils/**'
      - 'config.py'
      - 'encrypt.py'
      - 'relay.py'
      - 'api/v1/**'
      - 'requirements.txt'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/desktop-operator-e2e.yml'
      - 'desktop-tauri/src/**'
      - 'desktop-tauri/src-tauri/src/**'
      - 'desktop-tauri/src-tauri/python/**'
      - 'desktop-tauri/src-tauri/tauri.conf.json'
      - 'desktop-tauri/scripts/test_packaged_operator_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_operator_ui_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_no_relay_autostart_e2e.py'
      - 'desktop-tauri/scripts/test_desktop_relay_operator_parity_e2e.py'
      - 'desktop-tauri/scripts/run_desktop_parity_checks.py'
      - 'desktop-tauri/scripts/test_windows_installer_identity.py'
      - 'tests/unit/test_desktop_release_artifacts.py'
      - 'tests/unit/test_windows_installer_refusal.py'
      - 'desktop-tauri/src-tauri/installers/**'
      - 'tests/unit/test_model_manager.py'
      - 'tests/integration/test_desktop_qwen64k_packaged_runtime.py'
      - 'scripts/long_context_benchmark.py'
      - 'scripts/long_context_benchmark/**'
      - 'scripts/provision-ci-tiny-gguf.sh'
      - 'tests/unit/test_long_context_benchmark_harness.py'
      - 'utils/**'
      - 'config.py'
      - 'encrypt.py'
      - 'relay.py'
      - 'api/v1/**'
      - 'requirements.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-operator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install desktop Node dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run targeted Rust regressions
        run: |
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml operator_logs
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml compute_node

      - name: Install tauri-driver
        run: cargo install tauri-driver

      - name: Build desktop frontend assets
        working-directory: desktop-tauri
        run: npm run build

      - name: Build desktop binary (debug, no bundle)
        working-directory: desktop-tauri
        run: npm run tauri build -- --debug --no-bundle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: config/requirements_codex_verification.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements_codex_verification.txt
          python -m pip install "$(sed -n '/^llama_cpp_python==/p' requirements.txt)"
          pip install selenium

      - name: Restore cached tiny real GGUF for desktop operator UI e2e
        uses: actions/cache@v4
        with:
          path: .ci-models/stories15M-q4_0.gguf
          key: ci-relay-landing-page-real-desktop-bridge-api-v1-stories15m-q4-rev-99dd1a73db5a37100bd4ae633f4cfce6560e1567-sha256-6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04

      - name: Provision tiny real GGUF for desktop operator UI e2e
        env:
          TOKENPLACE_REAL_E2E_MODEL_PATH: ${{ github.workspace }}/.ci-models/stories15M-q4_0.gguf
        run: bash scripts/provision-ci-tiny-gguf.sh "$TOKENPLACE_REAL_E2E_MODEL_PATH"

      - name: Run full Rust suite
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml

      - name: Run desktop operator UI e2e
        env:
          TOKENPLACE_REAL_E2E_MODEL_PATH: ${{ github.workspace }}/.ci-models/stories15M-q4_0.gguf
        run: xvfb-run -a python desktop-tauri/scripts/test_desktop_operator_ui_e2e.py

      - name: Run packaged operator bridge e2e
        run: python desktop-tauri/scripts/test_packaged_operator_e2e.py

      - name: Run shared desktop parity checks without duplicate packaged e2e
        run: python desktop-tauri/scripts/run_desktop_parity_checks.py --skip-packaged

      - name: Run packaged cancellation and integration regressions
        # This step has hung silently to the job's own timeout-minutes ceiling
        # more than once (the whole file normally finishes in ~2s locally with
        # 21 passing tests). A job-level timeout hard-kills the entire job and
        # skips every remaining step - including `if: always()` upload steps -
        # so no diagnostic evidence survives that path. Wrapping the command in
        # a shell-level `timeout` here instead lets *this step* fail cleanly and
        # quickly (well under the job ceiling) with its already-streamed output
        # intact, so the actual hang can be diagnosed from the log instead of
        # disappearing into an unretrievable job-level cancellation.
        run: |
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest tests/integration/test_desktop_qwen64k_packaged_runtime.py -q --durations=25
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::integration regressions step hung past its 180s diagnostic timeout"
          fi
          exit "$status"

      - name: Upload desktop e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-operator-e2e-logs
          path: .desktop-e2e-logs/
          include-hidden-files: true
          if-no-files-found: warn

  desktop-operator-packaged-e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements_codex_verification.txt

      - name: Run long-context benchmark harness unit contracts
        run: python -m pytest -q -p no:cacheprovider tests/unit/test_long_context_benchmark_harness.py

      - name: Run Windows installer refusal unit contracts
        run: python -m pytest -q -p no:cacheprovider tests/unit/test_windows_installer_refusal.py

      - name: Smoke test long-context benchmark matrix plan
        run: python scripts/long_context_benchmark.py matrix-plan

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Windows packaged-start unit regressions with poisoned host Python state
        shell: pwsh
        env:
          TOKEN_PLACE_SENTINEL_PATH: C:\Windows\System32
          PYTHONHOME: C:\token-place-poison\pythonhome
          PYTHONPATH: C:\token-place-poison\pythonpath
          PYTHONUSERBASE: C:\token-place-poison\userbase
          VIRTUAL_ENV: C:\token-place-poison\venv
          CONDA_PREFIX: C:\token-place-poison\conda
          PIP_INDEX_URL: https://invalid.token.place.local/simple
          CMAKE_ARGS: -DTOKEN_PLACE_SENTINEL=ON
          FORCE_CMAKE: '1'
          TOKEN_PLACE_SIDECAR_PYTHON: C:\token-place-poison\python.exe
          TOKEN_PLACE_PYTHON_IMPORT_ROOT: C:\token-place-poison\import-root
        run: |
          $env:PATH = "$env:TOKEN_PLACE_SENTINEL_PATH;$env:PATH"
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml prepare_operator_bridge_launch_configures_preflight_command_environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml bundled_metadata_probe_sanitizes_poisoned_host_python_state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml no_child_startup_failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js for Windows package
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install desktop Node dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Cache embedded Windows CUDA Python runtime artifacts
        uses: actions/cache@v4
        with:
          path: desktop-tauri/.cache/windows-python-runtime
          key: windows-cuda-python-runtime-${{ runner.os }}-${{ hashFiles('desktop-tauri/src-tauri/python/embedded_python_runtime_windows_x86_64_manifest.json') }}

      - name: Prepare embedded Windows runtime
        working-directory: desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_windows_embedded_python_runtime.py
          test -f src-tauri/python-runtime/python.exe
          src-tauri/python-runtime/python.exe -m pip check

      - name: Build desktop frontend assets for Windows package
        working-directory: desktop-tauri
        run: npm run build

      - name: Build current-head Windows NSIS and MSI release packages
        working-directory: desktop-tauri
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,msi

      # Hosted Windows is driverless, so the cu124 runtime cannot import without
      # nvcuda.dll. Issue #1555 reserves native GPU proof for a GPU runner.
      - name: Validate installed structural CPU smoke and package identity
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one current-head NSIS installer, found $($installers.Count)." }
          $version = (Get-Content 'desktop-tauri/package.json' -Raw | ConvertFrom-Json).version
          $buildId = (git rev-parse --short=12 HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Reproduce the release flow: static NSIS extraction leaves a remembered
          # temporary /D destination even after uninstall. The identity harness
          # must explicitly select its own durable installation directory.
          python -c "import sys; from pathlib import Path; from scripts import validate_windows_desktop_release_artifacts as v; v.validate_artifact(Path(sys.argv[1]), sys.argv[2], 'NSIS', v._load_json(v.MANIFEST))" $installers[0].FullName $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-tauri/scripts/test_windows_installer_identity.py `
            --pr-current-windows-nsis $installers[0].FullName `
            --expected-version $version `
            --expected-build-id $buildId `
            --artifact-dir "$env:RUNNER_TEMP/token-place-current-package-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate same-format upgrades and cross-format refusals
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'desktop-tauri/package.json' -Raw | ConvertFrom-Json).version
          $buildId = (git rev-parse --short=12 HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = gh release list --repo futuroptimist/token.place --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = @($releases | Where-Object {
            -not $_.isDraft -and -not $_.isPrerelease -and
            $_.tagName -match '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' -and
            [version]($_.tagName -replace '^desktop-v', '') -lt [version]$version
          } | Sort-Object { [version]($_.tagName -replace '^desktop-v', '') } -Descending)[0]
          if (-not $previous) { throw 'No stable predecessor desktop release found.' }
          $previousVersion = $previous.tagName -replace '^desktop-v', ''
          $previousDir = Join-Path $env:RUNNER_TEMP 'token-place-previous-installers'
          New-Item -ItemType Directory -Path $previousDir | Out-Null
          gh release download $previous.tagName --repo futuroptimist/token.place --dir $previousDir --pattern "*$previousVersion*.msi" --pattern "*$previousVersion*-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $nsis = @(Get-ChildItem "$bundle/nsis" -Filter '*-setup.exe' -File)
          $msi = @(Get-ChildItem "$bundle/msi" -Filter '*.msi' -File)
          $oldNsis = @(Get-ChildItem $previousDir -Filter '*-setup.exe' -File)
          $oldMsi = @(Get-ChildItem $previousDir -Filter '*.msi' -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1 -or $oldNsis.Count -ne 1 -or $oldMsi.Count -ne 1) { throw 'Expected exactly one installer of each kind/version.' }
          $failed = @()
          # Each invocation checks initial cleanup convergence before installing.
          # Preserve both directions' evidence even when the first fails closed.
          foreach ($scenario in @('upgrade-nsis-to-nsis', 'upgrade-msi-to-msi', 'cross-nsis-to-msi', 'cross-msi-to-nsis')) {
            python desktop-tauri/scripts/test_windows_installer_identity.py `
              --windows-nsis $nsis[0].FullName --windows-msi $msi[0].FullName `
              --previous-windows-nsis $oldNsis[0].FullName --previous-windows-msi $oldMsi[0].FullName `
              --previous-version $previousVersion --expected-version $version `
              --expected-build-id $buildId --scenario $scenario `
              --artifact-dir "$env:RUNNER_TEMP/token-place-current-package-validation"
            if ($LASTEXITCODE -ne 0) { $failed += $scenario }
          }
          if ($failed.Count) { throw "Installer transition checks failed: $($failed -join ', ')" }

      - name: Run shared desktop parity checks (Windows)
        run: python desktop-tauri/scripts/run_desktop_parity_checks.py

      - name: Run Windows CUDA capability handoff regressions (fakes)
        run: |
          python -m pytest tests/unit/test_desktop_runtime_setup.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/unit/test_model_manager.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/integration/test_desktop_qwen64k_packaged_runtime.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload desktop relay parity logs on failure (Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-relay-operator-parity-logs-windows
          path: .desktop-e2e-logs/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload current-package validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-current-package-validation-windows
          path: ${{ runner.temp }}/token-place-current-package-validation/
          if-no-files-found: warn


  desktop-operator-packaged-inspect-python39-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies (Linux, Python 3.9 inspect)
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements_codex_verification.txt

      - name: Run dependency-isolated model bridge inspect smoke (Linux, Python 3.9)
        env:
          TOKEN_PLACE_INSPECT_ONLY: "1"
        run: python desktop-tauri/scripts/test_packaged_operator_e2e.py
