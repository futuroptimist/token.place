name: Qualify existing relay OCI index

on:
  workflow_dispatch:
    inputs:
      index_digest:
        description: Immutable OCI index digest (sha256 plus 64 lowercase hex characters)
        required: true
        type: string
      source_commit:
        description: Full source commit recorded by the image
        required: true
        type: string
      release_ref:
        description: Reviewed release ref (1-128 safe characters)
        required: true
        type: string
      release_base:
        description: Reviewed release base (1-128 safe characters)
        required: true
        type: string
      evidence_label:
        description: Short safe label for the evidence artifact
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    name: Read-only AMD64 and ARM64 qualification
    runs-on: ubuntu-latest
    env:
      REGISTRY_REPOSITORY: ghcr.io/futuroptimist/tokenplace-relay
      UNTRUSTED_INDEX_DIGEST: ${{ inputs.index_digest }}
      UNTRUSTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      UNTRUSTED_RELEASE_REF: ${{ inputs.release_ref }}
      UNTRUSTED_RELEASE_BASE: ${{ inputs.release_base }}
      UNTRUSTED_EVIDENCE_LABEL: ${{ inputs.evidence_label }}

    steps:
      - name: Check out the main-branch gate implementation
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: Validate untrusted dispatch inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          digest = os.environ["UNTRUSTED_INDEX_DIGEST"]
          source = os.environ["UNTRUSTED_SOURCE_COMMIT"]
          release_ref = os.environ["UNTRUSTED_RELEASE_REF"]
          release_base = os.environ["UNTRUSTED_RELEASE_BASE"]
          label = os.environ["UNTRUSTED_EVIDENCE_LABEL"]
          ref_pattern = re.compile(r"[A-Za-z0-9](?:[A-Za-z0-9._/-]{0,126}[A-Za-z0-9._-])?")
          label_pattern = re.compile(r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,46}[A-Za-z0-9])?")

          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("index_digest must be a full lowercase sha256 digest")
          if re.fullmatch(r"[0-9a-f]{40}", source) is None:
              raise SystemExit("source_commit must be a full lowercase Git commit")
          for name, value in (("release_ref", release_ref), ("release_base", release_base)):
              if ref_pattern.fullmatch(value) is None or ".." in value or "//" in value:
                  raise SystemExit(f"{name} is not a bounded safe ref")
          if label_pattern.fullmatch(label) is None:
              raise SystemExit("evidence_label is not a bounded safe label")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"index_digest={digest}\nsource_commit={source}\n")
              stream.write(f"release_ref={release_ref}\nrelease_base={release_base}\n")
              stream.write(f"evidence_label={label}\n")
          PY
          mkdir -p qualification-evidence .qualification-tmp
          printf '%s\n' "$(git rev-parse HEAD)" > qualification-evidence/gate-implementation-commit.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR for package reads
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect and resolve the immutable index
        id: descriptors
        env:
          INDEX_DIGEST: ${{ steps.inputs.outputs.index_digest }}
        shell: bash
        run: |
          set -euo pipefail
          coordinate="${REGISTRY_REPOSITORY}@${INDEX_DIGEST}"
          docker buildx imagetools inspect --raw "${coordinate}" > .qualification-tmp/index-raw.json
          test "$(wc -c < .qualification-tmp/index-raw.json)" -le 1048576
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path(".qualification-tmp/index-raw.json")
          document = json.loads(source.read_text(encoding="utf-8"))
          manifests = document.get("manifests")
          if document.get("schemaVersion") != 2 or not isinstance(manifests, list):
              raise SystemExit("supplied descriptor is not an OCI/Docker index")
          wanted = {("linux", "amd64"): [], ("linux", "arm64"): []}
          sanitized = {"schemaVersion": 2, "mediaType": str(document.get("mediaType", ""))[:128], "manifests": []}
          for item in manifests:
              if not isinstance(item, dict) or not re.fullmatch(r"sha256:[0-9a-f]{64}", str(item.get("digest", ""))):
                  raise SystemExit("index contains a malformed descriptor")
              platform = item.get("platform")
              if not isinstance(platform, dict):
                  raise SystemExit("index contains a descriptor without a platform")
              os_name, architecture = platform.get("os"), platform.get("architecture")
              if not isinstance(os_name, str) or not isinstance(architecture, str):
                  raise SystemExit("index contains a malformed platform")
              executable = os_name != "unknown" and architecture != "unknown"
              key = (os_name, architecture)
              if executable and key not in wanted:
                  raise SystemExit(f"unexpected executable platform: {os_name}/{architecture}")
              if executable:
                  wanted[key].append(item["digest"])
              sanitized["manifests"].append({
                  "digest": item["digest"],
                  "mediaType": str(item.get("mediaType", ""))[:128],
                  "platform": {"os": os_name[:32], "architecture": architecture[:32]},
              })
          if any(len(digests) != 1 for digests in wanted.values()):
              raise SystemExit("index must contain exactly one linux/amd64 and one linux/arm64 descriptor")
          Path("qualification-evidence/index-manifest.sanitized.json").write_text(
              json.dumps(sanitized, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"amd64={wanted[('linux', 'amd64')][0]}\n")
              stream.write(f"arm64={wanted[('linux', 'arm64')][0]}\n")
          PY

      - name: Pull and qualify linux/amd64 descriptor
        id: amd64_gate
        continue-on-error: true
        env:
          INDEX_DIGEST: ${{ steps.inputs.outputs.index_digest }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          RELEASE_REF: ${{ steps.inputs.outputs.release_ref }}
          RELEASE_BASE: ${{ steps.inputs.outputs.release_base }}
          PLATFORM_DIGEST: ${{ steps.descriptors.outputs.amd64 }}
        shell: bash
        run: |
          set -euo pipefail
          coordinate="${REGISTRY_REPOSITORY}@${PLATFORM_DIGEST}"
          docker pull --platform linux/amd64 "${coordinate}"
          python scripts/relay_release_safety_gate.py \
            --image "${coordinate}" --platform linux/amd64 \
            --source-commit "${SOURCE_COMMIT}" --resolved-revision "${SOURCE_COMMIT}" \
            --release-ref "${RELEASE_REF}" --release-base "${RELEASE_BASE}" \
            --registry-coordinate "${coordinate}" --index-digest "${INDEX_DIGEST}" \
            --platform-digest "${PLATFORM_DIGEST}" --port 15120 \
            --evidence qualification-evidence/amd64-evidence.json

      - name: Pull and qualify linux/arm64 descriptor
        id: arm64_gate
        continue-on-error: true
        env:
          INDEX_DIGEST: ${{ steps.inputs.outputs.index_digest }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          RELEASE_REF: ${{ steps.inputs.outputs.release_ref }}
          RELEASE_BASE: ${{ steps.inputs.outputs.release_base }}
          PLATFORM_DIGEST: ${{ steps.descriptors.outputs.arm64 }}
        shell: bash
        run: |
          set -euo pipefail
          coordinate="${REGISTRY_REPOSITORY}@${PLATFORM_DIGEST}"
          docker pull --platform linux/arm64 "${coordinate}"
          python scripts/relay_release_safety_gate.py \
            --image "${coordinate}" --platform linux/arm64 \
            --source-commit "${SOURCE_COMMIT}" --resolved-revision "${SOURCE_COMMIT}" \
            --release-ref "${RELEASE_REF}" --release-base "${RELEASE_BASE}" \
            --registry-coordinate "${coordinate}" --index-digest "${INDEX_DIGEST}" \
            --platform-digest "${PLATFORM_DIGEST}" --port 15220 \
            --evidence qualification-evidence/arm64-evidence.json

      - name: Clean local qualification resources
        id: cleanup
        if: always()
        env:
          AMD64_DIGEST: ${{ steps.descriptors.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.descriptors.outputs.arm64 }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          mapfile -t leftovers < <(docker ps -aq --filter 'name=relay-safety-')
          if (( ${#leftovers[@]} )); then
            docker rm -f "${leftovers[@]}" >/dev/null || status=1
          fi
          for digest in "${AMD64_DIGEST}" "${ARM64_DIGEST}"; do
            if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              docker image rm "${REGISTRY_REPOSITORY}@${digest}" >/dev/null 2>&1 || status=1
            fi
          done
          rm -rf .qualification-tmp || status=1
          exit "${status}"

      - name: Verify and package qualification evidence
        id: verify
        if: always()
        env:
          INDEX_DIGEST: ${{ steps.inputs.outputs.index_digest }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          RELEASE_REF: ${{ steps.inputs.outputs.release_ref }}
          RELEASE_BASE: ${{ steps.inputs.outputs.release_base }}
          EVIDENCE_LABEL: ${{ steps.inputs.outputs.evidence_label }}
          AMD64_DIGEST: ${{ steps.descriptors.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.descriptors.outputs.arm64 }}
          AMD64_OUTCOME: ${{ steps.amd64_gate.outcome }}
          ARM64_OUTCOME: ${{ steps.arm64_gate.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("qualification-evidence")
          manifest = root / "index-manifest.sanitized.json"
          if not manifest.exists():
              manifest.write_text('{"error":"index_manifest_unavailable","schemaVersion":2}\n', encoding="utf-8")
          expected_ids = {
              "metrics.valid_instrumentation", "metrics.no_flask_defaults", "metrics.no_raw_paths",
              "metrics.bounded_unmatched_paths", "quota.public_information_exempt",
              "quota.protected_rate_limited", "quota.protected_daily_limited",
              "quota.mutating_rate_limited", "quota.mutating_daily_limited",
          }
          expected = {
              "linux/amd64": (os.environ.get("AMD64_DIGEST", ""), root / "amd64-evidence.json"),
              "linux/arm64": (os.environ.get("ARM64_DIGEST", ""), root / "arm64-evidence.json"),
          }
          results = {}
          valid = os.environ.get("CLEANUP_OUTCOME") == "success"
          forbidden_keys = re.compile(
              r"credential|authorization|header|raw_path|request_body|response_body|client|key|token|ciphertext|prompt|model_output",
              re.IGNORECASE,
          )
          for platform, (digest, path) in expected.items():
              platform_ok = False
              if not path.exists():
                  path.write_text(
                      json.dumps({"schema_version": 2, "platform": platform, "passed": False,
                                  "error_category": "evidence_unavailable"}, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
              try:
                  evidence = json.loads(path.read_text(encoding="utf-8"))
                  keys = set(evidence.get("results", {}))
                  def all_keys(value):
                      if isinstance(value, dict):
                          for key, child in value.items():
                              yield str(key)
                              yield from all_keys(child)
                      elif isinstance(value, list):
                          for child in value:
                              yield from all_keys(child)

                  serialized_keys = " ".join(all_keys(evidence))
                  platform_ok = (
                      evidence.get("passed") is True
                      and evidence.get("cleanup", "success") != "failed"
                      and keys == expected_ids
                      and all(result.get("passed") is True and result.get("state") == "passed"
                              for result in evidence["results"].values())
                      and evidence.get("source_commit") == os.environ.get("SOURCE_COMMIT")
                      and evidence.get("release_ref") == os.environ.get("RELEASE_REF")
                      and evidence.get("release_base") == os.environ.get("RELEASE_BASE")
                      and evidence.get("index_digest") == os.environ.get("INDEX_DIGEST")
                      and evidence.get("platform") == platform
                      and evidence.get("platform_digest") == digest
                      and evidence.get("registry_coordinate") == f"{os.environ['REGISTRY_REPOSITORY']}@{digest}"
                      and forbidden_keys.search(serialized_keys) is None
                  )
              except (OSError, json.JSONDecodeError, TypeError, AttributeError):
                  platform_ok = False
              results[platform] = "passed" if platform_ok else "failed"
              valid = valid and platform_ok
          gate_commit_path = root / "gate-implementation-commit.txt"
          gate_commit = gate_commit_path.read_text(encoding="utf-8").strip() if gate_commit_path.exists() else ""
          metadata = {
              "schema_version": 1,
              "repository": os.environ["REGISTRY_REPOSITORY"],
              "index_digest": os.environ.get("INDEX_DIGEST", ""),
              "source_commit": os.environ.get("SOURCE_COMMIT", ""),
              "release_ref": os.environ.get("RELEASE_REF", ""),
              "release_base": os.environ.get("RELEASE_BASE", ""),
              "gate_implementation_commit": gate_commit,
              "platform_digests": {platform: value[0] for platform, value in expected.items()},
              "platform_results": results,
              "cleanup": "passed" if os.environ.get("CLEANUP_OUTCOME") == "success" else "failed",
              "passed": valid,
          }
          (root / "metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          files = [manifest, root / "amd64-evidence.json", root / "arm64-evidence.json", root / "metadata.json"]
          with (root / "SHA256SUMS").open("w", encoding="utf-8") as sums:
              for path in files:
                  if path.exists():
                      sums.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"passed={'true' if valid else 'false'}\n")
              output.write(f"amd64_result={results['linux/amd64']}\narm64_result={results['linux/arm64']}\n")
          PY

      - name: Upload immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-oci-qualification-${{ steps.inputs.outputs.evidence_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-evidence/index-manifest.sanitized.json
            qualification-evidence/amd64-evidence.json
            qualification-evidence/arm64-evidence.json
            qualification-evidence/metadata.json
            qualification-evidence/SHA256SUMS
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Write qualification summary
        if: always()
        env:
          INDEX_DIGEST: ${{ steps.inputs.outputs.index_digest }}
          SOURCE_COMMIT: ${{ steps.inputs.outputs.source_commit }}
          EVIDENCE_LABEL: ${{ steps.inputs.outputs.evidence_label }}
          AMD64_DIGEST: ${{ steps.descriptors.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.descriptors.outputs.arm64 }}
          AMD64_RESULT: ${{ steps.verify.outputs.amd64_result }}
          ARM64_RESULT: ${{ steps.verify.outputs.arm64_result }}
        shell: bash
        run: |
          set -euo pipefail
          gate_commit="$(cat qualification-evidence/gate-implementation-commit.txt 2>/dev/null || printf unavailable)"
          artifact="relay-oci-qualification-${EVIDENCE_LABEL:-invalid-input}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "## Existing relay OCI qualification"
            echo ""
            echo "- Source commit: \`${SOURCE_COMMIT:-unavailable}\`"
            echo "- Index digest: \`${INDEX_DIGEST:-unavailable}\`"
            echo "- linux/amd64 descriptor: \`${AMD64_DIGEST:-unavailable}\` — ${AMD64_RESULT:-failed}"
            echo "- linux/arm64 descriptor: \`${ARM64_DIGEST:-unavailable}\` — ${ARM64_RESULT:-failed}"
            echo "- Gate implementation commit: \`${gate_commit}\`"
            echo "- Evidence artifact: \`${artifact}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce complete qualification
        if: always()
        env:
          QUALIFICATION_PASSED: ${{ steps.verify.outputs.passed }}
        run: test "${QUALIFICATION_PASSED}" = true
