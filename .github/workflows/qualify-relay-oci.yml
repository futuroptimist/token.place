name: Qualify an immutable relay OCI index

on:
  workflow_dispatch:
    inputs:
      index_digest: {description: Full sha256 digest, required: true, type: string}
      source_commit: {description: Full source commit, required: true, type: string}
      release_ref: {description: Reviewed source ref, required: true, type: string}
      release_base: {description: Reviewed source base, required: true, type: string}
      evidence_label: {description: Lowercase evidence label, required: true, type: string}

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      OCI_REPOSITORY: ghcr.io/futuroptimist/tokenplace-relay
      INPUT_INDEX_DIGEST: ${{ inputs.index_digest }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_RELEASE_REF: ${{ inputs.release_ref }}
      INPUT_RELEASE_BASE: ${{ inputs.release_base }}
      INPUT_EVIDENCE_LABEL: ${{ inputs.evidence_label }}
      ARTIFACT_NAME: relay-oci-qualification-${{ github.run_id }}-${{ github.run_attempt }}
      RAW_DIR: qualification-raw
      ARTIFACT_DIR: qualification-artifacts
    steps:
      - name: Check out the main-branch gate implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record gate commit and validate untrusted inputs
        id: inputs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RAW_DIR}" "${ARTIFACT_DIR}"
          gate_commit="$(git rev-parse HEAD)"
          [[ "${gate_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${INPUT_INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${INPUT_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${INPUT_RELEASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          [[ "${INPUT_RELEASE_BASE}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          [[ "${INPUT_EVIDENCE_LABEL}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          for value in "${INPUT_RELEASE_REF}" "${INPUT_RELEASE_BASE}"; do
            [[ "${value}" != *..* && "${value}" != *//* && "${value}" != */ ]]
          done
          printf 'GATE_COMMIT=%s\n' "${gate_commit}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys = ("evidence_label", "index_digest", "release_base", "release_ref", "source_commit")
          record = {key: os.environ["INPUT_" + key.upper()] for key in keys}
          Path(os.environ["RAW_DIR"], "validated-inputs.json").write_text(json.dumps(record, sort_keys=True)+"\n")
          PY

      - name: Set up QEMU for ARM64
        if: steps.inputs.outcome == 'success'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with: {platforms: arm64}
      - name: Set up Docker Buildx
        if: steps.inputs.outcome == 'success'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for package reads
        if: steps.inputs.outcome == 'success'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect and validate the immutable index
        id: index
        if: steps.inputs.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          raw="${RAW_DIR}/index.raw.json"
          trap 'rm -f "${raw}"' EXIT
          docker buildx imagetools inspect --raw "${OCI_REPOSITORY}@${INPUT_INDEX_DIGEST}" > "${raw}"
          RAW_INDEX="${raw}" python - <<'PY'
          import json, os, re
          from pathlib import Path

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value: raise ValueError("duplicate JSON member")
                  value[key] = item
              return value

          path = Path(os.environ["RAW_INDEX"])
          if not path.is_file() or path.stat().st_size > 1_000_000: raise SystemExit("invalid index size")
          try: data = json.loads(path.read_text(), object_pairs_hook=unique)
          except (UnicodeError, json.JSONDecodeError, ValueError): raise SystemExit("invalid index JSON")
          index_types = {"application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json"}
          image_types = {"application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"}
          digest_re = re.compile(r"sha256:[0-9a-f]{64}\Z")
          if not isinstance(data, dict) or type(data.get("schemaVersion")) is not int or data["schemaVersion"] != 2 or data.get("mediaType") not in index_types: raise SystemExit("invalid OCI index identity")
          manifests = data.get("manifests")
          if not isinstance(manifests, list) or len(manifests) > 128: raise SystemExit("invalid descriptor list")
          selected = {}
          for item in manifests:
              if not isinstance(item, dict) or set(item) != {"mediaType", "digest", "size", "platform"}: raise SystemExit("malformed descriptor")
              if item.get("mediaType") not in image_types or not digest_re.fullmatch(item.get("digest", "")): raise SystemExit("descriptor is not an image manifest")
              if type(item.get("size")) is not int or not 1 <= item["size"] <= 2_147_483_647: raise SystemExit("invalid descriptor size")
              platform = item.get("platform")
              if not isinstance(platform, dict) or set(platform) != {"architecture", "os"}: raise SystemExit("invalid descriptor platform")
              os_name, arch = platform.get("os"), platform.get("architecture")
              if not isinstance(os_name, str) or not isinstance(arch, str) or len(os_name) > 32 or len(arch) > 32: raise SystemExit("invalid platform fields")
              pair = f"{os_name}/{arch}"
              if pair in ("linux/amd64", "linux/arm64"):
                  if pair in selected: raise SystemExit("duplicate executable platform")
                  selected[pair] = {"digest": item["digest"], "mediaType": item["mediaType"], "size": item["size"], "platform": {"architecture": arch, "os": os_name}}
              elif pair != "unknown/unknown": raise SystemExit("unexpected executable platform")
          if set(selected) != {"linux/amd64", "linux/arm64"}: raise SystemExit("missing executable platform")
          sanitized = {"schemaVersion": 2, "mediaType": data["mediaType"], "manifests": [selected[key] for key in ("linux/amd64", "linux/arm64")]}
          Path(os.environ["ARTIFACT_DIR"], "index-manifest.json").write_text(json.dumps(sanitized, indent=2, sort_keys=True)+"\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write(f"AMD64_DIGEST={selected['linux/amd64']['digest']}\nARM64_DIGEST={selected['linux/arm64']['digest']}\n")
          PY

      - name: Pull and qualify both immutable platform descriptors
        id: gates
        if: steps.inputs.outcome == 'success' && steps.index.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          overall=0
          cleanup_owned() {
            local ids=() status=0 id listing="${RAW_DIR}/docker-ps.tmp"
            if docker ps -aq --filter 'name=relay-safety-' > "${listing}"; then
              mapfile -t ids < "${listing}" || status=1
            else
              status=1
            fi
            rm -f "${listing}" || status=1
            for id in "${ids[@]}"; do docker rm -f "${id}" >/dev/null 2>&1 || status=1; done
            return "${status}"
          }
          finish() {
            local status=$?
            cleanup_owned || status=1
            rm -f "${RAW_DIR}"/*.tmp "${RAW_DIR}"/*.raw.json || status=1
            trap - EXIT
            exit "${status}"
          }
          trap finish EXIT
          trap 'exit 130' INT TERM
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"; port=55200; platform_digest="${ARM64_DIGEST}"
            if [[ "${arch}" == amd64 ]]; then port=55100; platform_digest="${AMD64_DIGEST}"; fi
            coordinate="${OCI_REPOSITORY}@${platform_digest}"
            evidence="${RAW_DIR}/relay-release-safety-${arch}-evidence.json"
            gate_status=0; docker pull --platform "${platform}" "${coordinate}" || gate_status=$?
            if [[ "${gate_status}" -eq 0 ]]; then
              python scripts/relay_release_safety_gate.py --image "${coordinate}" --platform "${platform}" \
                --source-commit "${INPUT_SOURCE_COMMIT}" --release-ref "${INPUT_RELEASE_REF}" --release-base "${INPUT_RELEASE_BASE}" \
                --resolved-revision "${INPUT_SOURCE_COMMIT}" --registry-coordinate "${coordinate}" \
                --index-digest "${INPUT_INDEX_DIGEST}" --platform-digest "${platform_digest}" --port "${port}" --evidence "${evidence}" || gate_status=$?
            fi
            cleanup_status=0; cleanup_owned || cleanup_status=$?
            printf '{"cleanup_status":%d,"gate_status":%d}\n' "${cleanup_status}" "${gate_status}" > "${RAW_DIR}/${arch}-outcome.json"
            [[ "${gate_status}" -eq 0 && "${cleanup_status}" -eq 0 ]] || overall=1
          done
          exit "${overall}"

      - name: Verify evidence and assemble bounded record
        id: evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out, raw = Path(os.environ["ARTIFACT_DIR"]), Path(os.environ["RAW_DIR"])
          out.mkdir(exist_ok=True); failures=[]
          def unique(pairs):
              value={}
              for key,item in pairs:
                  if key in value: raise ValueError("duplicate JSON member")
                  value[key]=item
              return value
          def load(path, limit=1_000_000):
              if not path.is_file() or path.stat().st_size > limit: raise ValueError("missing or oversized JSON")
              value=json.loads(path.read_text(), object_pairs_hook=unique)
              if not isinstance(value, dict): raise ValueError("JSON root is not an object")
              return value
          try: validated=load(raw/"validated-inputs.json", 4096)
          except Exception: validated={key:"invalid" for key in ("evidence_label","index_digest","release_base","release_ref","source_commit")}; failures.append("inputs")
          try:
              contract=load(Path("config/relay_release_safety_contract.json"))
              required=[entry["id"] for entry in contract["requirements"]]
              if len(required)!=len(set(required)): raise ValueError("duplicate contract IDs")
          except Exception: required=[]; failures.append("contract")
          digests={"linux/amd64":os.environ.get("AMD64_DIGEST","unresolved"),"linux/arm64":os.environ.get("ARM64_DIGEST","unresolved")}
          statuses={}
          contract_path="config/relay_release_safety_contract.json"
          digest=lambda value: isinstance(value,str) and len(value)==71 and value.startswith("sha256:") and all(c in "0123456789abcdef" for c in value[7:])
          def bounded_int(value, lower=0, upper=10_000):
              return type(value) is int and lower <= value <= upper
          def project_result(result_id, value):
              if not isinstance(value,dict) or value.get("state")!="passed" or value.get("passed") is not True:
                  raise ValueError("failed result")
              projected={"passed":True,"state":"passed"}
              if result_id=="metrics.bounded_unmatched_paths":
                  fields=("batch_size","total_unmatched_requests","first_batch_growth","second_batch_growth")
                  if set(value)!={"passed","state",*fields} or any(not bounded_int(value[key]) for key in fields):
                      raise ValueError("invalid bounded-metrics result")
                  projected.update((key,value[key]) for key in fields)
              elif result_id=="quota.public_information_exempt":
                  fields={"passed","state","safe_methods_response_class","sentinel_status_codes","predicate_exact"}
                  codes=value.get("sentinel_status_codes")
                  if set(value)!=fields or value.get("safe_methods_response_class")!="2xx" or value.get("predicate_exact") is not True or not isinstance(codes,list) or len(codes)!=2 or any(not bounded_int(code,100,599) for code in codes):
                      raise ValueError("invalid public-quota result")
                  projected.update(safe_methods_response_class="2xx",sentinel_status_codes=list(codes),predicate_exact=True)
              elif result_id.startswith("quota."):
                  codes=value.get("status_codes")
                  if set(value)!={"passed","state","status_codes"} or not isinstance(codes,list) or len(codes)!=2 or any(not bounded_int(code,100,599) for code in codes):
                      raise ValueError("invalid quota result")
                  projected["status_codes"]=list(codes)
              elif set(value)!={"passed","state"}:
                  raise ValueError("unexpected result member")
              return projected
          for platform,arch in (("linux/amd64","amd64"),("linux/arm64","arm64")):
              source=raw/f"relay-release-safety-{arch}-evidence.json"; target=out/f"relay-release-safety-{arch}-evidence.json"
              try:
                  evidence=load(source)
                  outcome=load(raw/f"{arch}-outcome.json",4096)
                  if set(outcome)!={"cleanup_status","gate_status"} or any(type(outcome[k]) is not int for k in outcome): raise ValueError("invalid outcome")
                  if outcome!={"cleanup_status":0,"gate_status":0}: raise ValueError("executor failed")
                  results=evidence.get("results")
                  if type(evidence.get("schema_version")) is not int or evidence["schema_version"] != 2 or evidence.get("passed") is not True or not isinstance(results,dict) or set(results)!=set(required): raise ValueError("invalid results")
                  expected={"passed":True,"source_commit":validated["source_commit"],"release_ref":validated["release_ref"],"release_base":validated["release_base"],"platform":platform,"index_digest":validated["index_digest"],"platform_digest":digests[platform],"registry_coordinate":f"{os.environ['OCI_REPOSITORY']}@{digests[platform]}"}
                  if any(evidence.get(k)!=v for k,v in expected.items()): raise ValueError("identity mismatch")
                  allowed=set(expected)|{"schema_version","cleanup","results","contract","image_id"}
                  if set(evidence)-allowed or evidence.get("contract")!=contract_path or not digest(evidence.get("image_id")) or evidence.get("cleanup","passed")!="passed": raise ValueError("invalid evidence member")
                  projected={key:evidence[key] for key in expected}
                  projected.update(schema_version=2,contract=contract_path,image_id=evidence["image_id"],cleanup="passed",results={key:project_result(key,results[key]) for key in required})
                  target.write_text(json.dumps(projected,indent=2,sort_keys=True)+"\n"); statuses[platform]="passed"
              except Exception:
                  statuses[platform]="failed"; failures.append(platform)
                  target.write_text(json.dumps({"schema_version":2,"passed":False,"platform":platform,"error_category":"evidence_rejected"},sort_keys=True)+"\n")
              finally: source.unlink(missing_ok=True)
          index=out/"index-manifest.json"
          if not index.is_file(): index.write_text(json.dumps({"schemaVersion":2,"error":"index_validation_failed"},sort_keys=True)+"\n"); failures.append("index")
          metadata={"schema_version":2,"evidence_label":validated["evidence_label"],"repository":os.environ["OCI_REPOSITORY"],"source_commit":validated["source_commit"],"index_digest":validated["index_digest"],"release_ref":validated["release_ref"],"release_base":validated["release_base"],"gate_commit":os.environ.get("GATE_COMMIT","unresolved"),"platform_digests":digests,"platform_results":statuses,"qualification_passed":not failures}
          (out/"qualification-metadata.json").write_text(json.dumps(metadata,indent=2,sort_keys=True)+"\n")
          names=["index-manifest.json","relay-release-safety-amd64-evidence.json","relay-release-safety-arm64-evidence.json","qualification-metadata.json"]
          (out/"SHA256SUMS").write_text("".join(f"{hashlib.sha256((out/name).read_bytes()).hexdigest()}  {name}\n" for name in names))
          if failures: raise SystemExit("qualification evidence rejected")
          PY

      - name: Final owned-resource cleanup before upload
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status=0; ids=(); listing="${RAW_DIR}/docker-ps.tmp"
          if docker ps -aq --filter 'name=relay-safety-' > "${listing}"; then
            mapfile -t ids < "${listing}" || status=1
          else
            status=1
          fi
          rm -f "${listing}" || status=1
          for id in "${ids[@]}"; do docker rm -f "${id}" >/dev/null 2>&1 || status=1; done
          find "${RAW_DIR}" -type f -delete || status=1
          rmdir "${RAW_DIR}" || status=1
          exit "${status}"

      - name: Finalize executor outcomes and checksums
        id: finalize
        if: always()
        shell: bash
        env:
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path(os.environ["ARTIFACT_DIR"]); path=out/"qualification-metadata.json"
          metadata=json.loads(path.read_text())
          outcomes={key:os.environ[key.upper()+"_OUTCOME"] for key in ("inputs","index","gates","evidence","cleanup")}
          metadata["executor_outcomes"]=outcomes
          metadata["qualification_passed"]=metadata.get("qualification_passed") is True and set(outcomes.values())=={"success"}
          path.write_text(json.dumps(metadata,indent=2,sort_keys=True)+"\n")
          names=["index-manifest.json","relay-release-safety-amd64-evidence.json","relay-release-safety-arm64-evidence.json","qualification-metadata.json"]
          (out/"SHA256SUMS").write_text("".join(f"{hashlib.sha256((out/name).read_bytes()).hexdigest()}  {name}\n" for name in names))
          PY

      - name: Upload the immutable qualification evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            qualification-artifacts/index-manifest.json
            qualification-artifacts/relay-release-safety-amd64-evidence.json
            qualification-artifacts/relay-release-safety-arm64-evidence.json
            qualification-artifacts/qualification-metadata.json
            qualification-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Write qualification summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          metadata="${ARTIFACT_DIR}/qualification-metadata.json"
          echo '## Immutable relay OCI qualification' >> "${GITHUB_STEP_SUMMARY}"
          jq -r '[
            "Source commit: " + .source_commit,
            "Index: " + .repository + "@" + .index_digest,
            "AMD64 descriptor: " + .platform_digests["linux/amd64"],
            "ARM64 descriptor: " + .platform_digests["linux/arm64"],
            "Gate commit: " + .gate_commit,
            "AMD64 result: " + .platform_results["linux/amd64"],
            "ARM64 result: " + .platform_results["linux/arm64"],
            "Executor outcomes: " + (.executor_outcomes | tojson),
            "Qualification passed: " + (.qualification_passed | tostring)
          ] | .[]' "${metadata}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Artifact: ${ARTIFACT_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove uploaded local evidence
        id: local_cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_DIR}"
          [[ ! -e "${ARTIFACT_DIR}" ]]

      - name: Enforce qualification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.inputs.outcome }}" == success ]]
          [[ "${{ steps.index.outcome }}" == success ]]
          [[ "${{ steps.gates.outcome }}" == success ]]
          [[ "${{ steps.evidence.outcome }}" == success ]]
          [[ "${{ steps.cleanup.outcome }}" == success ]]
          [[ "${{ steps.finalize.outcome }}" == success ]]
          [[ "${{ steps.local_cleanup.outcome }}" == success ]]
