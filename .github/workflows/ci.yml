name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    name: Run tests + relay landing-page real desktop-bridge API v1 guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Include the PR merge's source-head parent for the one-shot gate.
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Prepare Raspberry Pi cgroups
        id: prep
        run: |
          set +e
          sudo bash scripts/prepare-pi-cgroups.sh
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            exit 0
          fi
          exit "$rc"
      - name: Stop for reboot
        if: steps.prep.outputs.rc == '2'
        run: |
          echo "Cgroup configuration updated. Reboot runner and re-run job." >> "$GITHUB_STEP_SUMMARY"
          echo "Cgroup configuration updated. Hosted CI cannot reboot in-job, so this run must fail instead of skipping run_all_tests.sh." >&2
          exit 1
      - name: Validate dependency compatibility
        run: python scripts/validate_dependencies.py
        if: steps.prep.outputs.rc != '2'
      - name: Install Python dependencies
        if: steps.prep.outputs.rc != '2'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Valkey integration-test server
        if: steps.prep.outputs.rc != '2'
        run: |
          sudo apt-get update
          sudo apt-get install --yes valkey-server
      - name: Install Playwright browsers and system dependencies
        if: steps.prep.outputs.rc != '2'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python scripts/run_with_timeout_retry.py \
            --timeout 240 --grace 15 --attempts 2 --delay 15 -- \
            python -m playwright install --with-deps chromium
      - name: Install Node.js dependencies
        if: steps.prep.outputs.rc != '2'
        run: npm ci
      - name: Restore cached tiny real GGUF for relay landing-page desktop-bridge API v1 guardrail
        if: steps.prep.outputs.rc != '2'
        uses: actions/cache@v4
        with:
          path: .ci-models/stories15M-q4_0.gguf
          key: ci-relay-landing-page-real-desktop-bridge-api-v1-stories15m-q4-rev-99dd1a73db5a37100bd4ae633f4cfce6560e1567-sha256-6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04
      - name: Provision tiny real GGUF for relay landing-page desktop-bridge API v1 guardrail
        if: steps.prep.outputs.rc != '2'
        env:
          TOKENPLACE_REAL_E2E_MODEL_PATH: ${{ github.workspace }}/.ci-models/stories15M-q4_0.gguf
        run: bash scripts/provision-ci-tiny-gguf.sh "$TOKENPLACE_REAL_E2E_MODEL_PATH"
      - name: Record bounded native inference metadata
        continue-on-error: true
        if: steps.prep.outputs.rc != '2'
        run: |
          mkdir -p .ci-native-diagnostics
          python scripts/ci_native_inference_diagnostics.py > .ci-native-diagnostics/metadata.json
          cat .ci-native-diagnostics/metadata.json
      - name: Verify tiny real GGUF loads via relay landing-page desktop-bridge API v1 guardrail
        id: native_inference
        if: steps.prep.outputs.rc != '2'
        env:
          TOKENPLACE_REAL_E2E_MODEL_PATH: ${{ github.workspace }}/.ci-models/stories15M-q4_0.gguf
          RUN_RELAY_REGISTRATION_TESTS: '1'
          PYTHONFAULTHANDLER: '1'
          TOKEN_PLACE_CI_NATIVE_DIAGNOSTICS: ${{ github.workspace }}/.ci-native-diagnostics
        run: |
          mkdir -p .ci-native-diagnostics
          set +e
          python -m pytest -q tests/e2e/test_ui.py -k 'landing_chat_real_inference_with_desktop_bridge_api_v1' > .ci-native-diagnostics/inference-full.log 2>&1
          result=$?
          python scripts/ci_native_inference_diagnostics.py > .ci-native-diagnostics/metadata-after.json || echo "::warning::Post-test metadata unavailable"
          tail -c 65536 .ci-native-diagnostics/inference-full.log > .ci-native-diagnostics/inference-tail.log
          cat .ci-native-diagnostics/inference-tail.log
          rm .ci-native-diagnostics/inference-full.log
          python scripts/ci_native_inference_diagnostics.py --bound-worker-output || echo "::warning::Worker diagnostics unavailable"
          exit "$result"
      - name: Select the single approved provisioned debugger attempt
        id: probe_gate
        if: always() && (steps.native_inference.outcome == 'failure' || steps.native_inference.outcome == 'success') && github.event_name == 'pull_request' && github.event.pull_request.number == 1927 && github.event.action == 'synchronize' && github.run_attempt == 1
        env:
          PROBE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A later commit or retry must not silently repeat this one probe.
          subject=$(git show -s --format=%s "$PROBE_HEAD")
          if [ "$subject" != '[native-probe-provisioned-once] Capture backend initialization SIGILL' ]; then
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Provision GDB from the official runner OS source once
        id: gdb_setup
        if: always() && steps.probe_gate.outputs.enabled == 'true'
        timeout-minutes: 10
        run: |
          ulimit -c 0
          python scripts/ci_native_debugger_probe.py --validate-ubuntu-source
          mkdir -p .ci-native-diagnostics
          set +e
          sudo -n timeout --signal=TERM --kill-after=5s 580s bash -euo pipefail <<'SETUP' > "$RUNNER_TEMP/gdb-setup.log" 2>&1
          lists=$(mktemp -d /tmp/token-place-gdb-apt.XXXXXX)
          chmod 755 "$lists"
          options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                   -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$lists"
                   -o Acquire::Retries=0 -o APT::Get::Update::Error-Mode=any
                   -o Dpkg::Use-Pty=0)
          apt-get "${options[@]}" update
          apt-get "${options[@]}" --simulate install --no-upgrade --no-remove --no-install-recommends gdb > "$lists/plan.txt"
          if grep -Eq '^(Remv|Inst [^ ]+ \[)' "$lists/plan.txt"; then
            echo 'Refusing a debugger plan that changes existing OS packages'
            exit 1
          fi
          apt-get "${options[@]}" install --yes --no-upgrade --no-remove --no-install-recommends gdb
          dpkg-query -W -f='${Package} ${Version}\n' gdb
          SETUP
          result=$?
          tail -c 65536 "$RUNNER_TEMP/gdb-setup.log" > .ci-native-diagnostics/gdb-setup-tail.log
          printf '{"setup_exit":%d}\n' "$result" > .ci-native-diagnostics/gdb-setup.json
          exit "$result"
      - name: One approved disposable native debugger probe
        if: always() && steps.probe_gate.outputs.enabled == 'true' && steps.gdb_setup.outcome == 'success'
        timeout-minutes: 10
        env:
          TOKEN_PLACE_PROBE_SUBJECT: '[native-probe-provisioned-once] Capture backend initialization SIGILL'
        run: |
          ulimit -c 0
          python scripts/ci_native_debugger_probe.py
      - name: Enforce the diagnostic text allowlist and 8 MiB cap
        id: diagnostic_budget
        if: always() && steps.prep.outputs.rc != '2'
        run: python scripts/ci_native_debugger_probe.py --check-output-budget
      - name: Retain bounded native inference diagnostics
        if: always() && steps.prep.outputs.rc != '2' && steps.diagnostic_budget.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-inference-diagnostics
          # Only the explicit bounded diagnostic allowlist below is uploaded.
          include-hidden-files: true
          path: |
            .ci-native-diagnostics/metadata.json
            .ci-native-diagnostics/metadata-after.json
            .ci-native-diagnostics/inference-tail.log
            .ci-native-diagnostics/worker-*.tail
            .ci-native-diagnostics/debugger-probe.json
            .ci-native-diagnostics/gdb-setup-tail.log
            .ci-native-diagnostics/gdb-setup.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify encrypted progress landing-page lifecycle
        if: steps.prep.outputs.rc != '2'
        env:
          RUN_E2E: '1'
        run: python -m pytest -q tests/e2e/test_ui.py -k 'landing_chat_uses_api_v1_only_non_streaming' -x
      - name: Run tests
        if: steps.prep.outputs.rc != '2'
        run: ./run_all_tests.sh
        env:
          TEST_COVERAGE: '1'
          # Keep the relay landing-page desktop-bridge API v1 guardrail always-on in CI.
          # This tiny real model avoids fake inference while keeping CI fast and cache-friendly.
          TOKENPLACE_REAL_E2E_MODEL_PATH: ${{ github.workspace }}/.ci-models/stories15M-q4_0.gguf
      - name: Upload coverage reports to Codecov
        if: steps.prep.outputs.rc != '2'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Summarize workflow errors
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail

          mkdir -p .gha-logs
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/logs" \
            -o .gha-logs/workflow-logs.zip \
          || { echo "::warning::Could not download workflow logs; skipping error summary."; exit 0; }
          unzip -qo .gha-logs/workflow-logs.zip -d .gha-logs/raw \
          || { echo "::warning::Could not unzip workflow logs; skipping error summary."; exit 0; }

          python - <<'PY'
          import re
          from pathlib import Path

          raw_dir = Path('.gha-logs/raw')
          summary_file = Path('.gha-logs/error-summary.md')
          job_status = '${JOB_STATUS}'.strip().lower()
          ansi_re = re.compile(r'\x1B\[[0-9;]*[mGKHF]|\x1B\(B')

          patterns = [
              r'::error[^\n]*',
              r'##\[error\][^\n]*',
              r'^Error:\s+.*',
              r'^ERROR:\s+.*',
              r'^Traceback[^\n]*',
              r'^Exception[^\n]*',
              r'^(?:FAIL|FAILED)\b[^\n]*',
              r'^AssertionError[^\n]*',
              r'^ModuleNotFoundError[^\n]*',
              r'^RuntimeError[^\n]*',
              r'^fatal[^\n]*',
          ]
          combined = re.compile('|'.join(f'({p})' for p in patterns), re.MULTILINE)
          interesting_re = re.compile(
              r'traceback|exception|assertionerror|modulenotfounderror|runtimeerror|\bfail(?:ed)?\b|fatal|error',
              re.IGNORECASE,
          )

          errors = []
          scanned_files = []
          texts_by_file = {}
          for log_file in sorted(raw_dir.rglob('*.txt')):
              relative = log_file.relative_to(raw_dir)
              scanned_files.append(relative)
              text = log_file.read_text(encoding='utf-8', errors='replace')
              texts_by_file[relative] = text
              for match in combined.finditer(text):
                  line = next(group for group in match.groups() if group)
                  line = ansi_re.sub('', line)
                  cleaned = re.sub(r'\s+', ' ', line).strip()
                  if cleaned:
                      errors.append((relative, cleaned))

          unique = []
          seen = set()
          for source, message in errors:
              key = (str(source), message)
              if key in seen:
                  continue
              seen.add(key)
              unique.append((source, message))

          with summary_file.open('w', encoding='utf-8') as out:
              out.write('## CI Error Summary\n\n')
              if not unique:
                  out.write('No direct error lines were detected in the workflow logs.\n')
                  if job_status != 'success':
                      out.write('\n### Fallback context (job failed)\n\n')
                      if not scanned_files:
                          out.write('- No log files were found in the downloaded archive.\n')
                      else:
                          out.write('Scanned log files:\n')
                          for source in scanned_files:
                              out.write(f'- `{source}`\n')

                          candidates = [
                              source
                              for source in scanned_files
                              if interesting_re.search(texts_by_file.get(source, ''))
                          ]
                          if not candidates:
                              candidates = scanned_files

                          out.write('\nLast 20 lines from fallback log files:\n')
                          for source in candidates:
                              out.write(f'\n#### `{source}`\n\n')
                              lines = texts_by_file.get(source, '').splitlines()
                              tail = lines[-20:] if lines else ['<empty log file>']
                              out.write('```\n')
                              for ln in tail:
                                  out.write(f'{ansi_re.sub("", ln)}\n')
                              out.write('```\n')
              else:
                  out.write(
                      'Captured from `::error`, `##[error]`, `Error:`/`ERROR:`, '\
                      '`Traceback`, `Exception`, `FAIL`/`FAILED`, `AssertionError`, '\
                      '`ModuleNotFoundError`, `RuntimeError`, and `fatal` log lines '\
                      'across all steps in this run.\n\n'
                  )
                  for source, message in unique:
                      out.write(f'- `{source}`: `{message}`\n')
          PY

          cat .gha-logs/error-summary.md >> "$GITHUB_STEP_SUMMARY"
