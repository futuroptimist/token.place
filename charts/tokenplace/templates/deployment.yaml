{{- $backend := .Values.stateBackend.type -}}
{{- $workers := int .Values.relay.workers -}}
{{- $replicas := int .Values.replicaCount -}}
{{- $ha := or (gt $workers 1) (gt $replicas 1) -}}
{{- if and (eq $backend "memory") $ha -}}
{{- fail "stateBackend.type=memory requires replicaCount=1 and relay.workers=1" -}}
{{- end -}}
{{- if and $ha (ne $backend "valkey") -}}
{{- fail "multiple replicas or workers require stateBackend.type=valkey" -}}
{{- end -}}
{{- if and $ha .Values.relay.legacyRoutesEnabled -}}
{{- fail "legacy relay routes are forbidden with multiple replicas or workers" -}}
{{- end -}}
{{- if eq $backend "valkey" -}}
{{- $v := .Values.stateBackend.valkey -}}
{{- $_ := required "stateBackend.valkey.environment is required" $v.environment -}}
{{- $_ := required "stateBackend.valkey.cluster is required" $v.cluster -}}
{{- $_ := required "stateBackend.valkey.acknowledgementKey.existingSecret is required" $v.acknowledgementKey.existingSecret -}}
{{- if eq $v.discovery "direct" -}}
{{- $_ := required "stateBackend.valkey.direct.host is required for direct discovery" $v.direct.host -}}
{{- else if eq $v.discovery "sentinel" -}}
{{- $_ := required "stateBackend.valkey.sentinel.service is required for Sentinel discovery" $v.sentinel.service -}}
{{- if not $v.sentinel.endpoints }}{{ fail "stateBackend.valkey.sentinel.endpoints is required for Sentinel discovery" }}{{ end -}}
{{- end -}}
{{- if and $v.auth.existingSecret (not (or $v.auth.usernameKey $v.auth.passwordKey)) }}{{ fail "stateBackend.valkey.auth requires a usernameKey or passwordKey" }}{{ end -}}
{{- if and $v.sentinel.auth.existingSecret (not (or $v.sentinel.auth.usernameKey $v.sentinel.auth.passwordKey)) }}{{ fail "stateBackend.valkey.sentinel.auth requires a usernameKey or passwordKey" }}{{ end -}}
{{- if and $v.tls.enabled (not $v.tls.existingSecret) }}{{ fail "stateBackend.valkey.tls.existingSecret is required when TLS is enabled" }}{{ end -}}
{{- end -}}
{{- if and $ha (ne .Values.strategy.type "RollingUpdate") }}{{ fail "multiple replicas or workers require strategy.type=RollingUpdate" }}{{ end -}}
{{- if and $ha (not .Values.podDisruptionBudget.enabled) }}{{ fail "multiple replicas or workers require podDisruptionBudget.enabled=true" }}{{ end -}}
{{- if and $ha (not .Values.topologySpreadConstraints) }}{{ fail "multiple replicas or workers require topologySpreadConstraints" }}{{ end -}}
{{- if and $ha (not .Values.preStop.enabled) }}{{ fail "multiple replicas or workers require preStop.enabled=true" }}{{ end -}}
{{- if and $ha (lt (int .Values.terminationGracePeriodSeconds) 10) }}{{ fail "multiple replicas or workers require terminationGracePeriodSeconds>=10" }}{{ end -}}
{{- if and (gt $replicas 1) .Values.podDisruptionBudget.enabled (ge (int .Values.podDisruptionBudget.maxUnavailable) $replicas) }}{{ fail "podDisruptionBudget.maxUnavailable must be less than replicaCount" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tokenplace.fullname" . }}
  labels:
    {{- include "tokenplace.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /*
      Resolve strategy type from a potentially sparse object (e.g. --set-json strategy={})
      so the manifest never renders `type: <no value>`.
  */}}
  {{- $strategyType := default "Recreate" .Values.strategy.type }}
  {{- $existing := lookup "apps/v1" "Deployment" .Release.Namespace (include "tokenplace.fullname" .) }}
  {{- $existingHasRollingUpdate := and $existing $existing.spec $existing.spec.strategy $existing.spec.strategy.rollingUpdate }}
  strategy:
    type: {{ $strategyType }}
    {{- /*
        Keep default Recreate renders free of rollingUpdate keys, but clear the live
        field during upgrades from older defaulted RollingUpdate Deployments.
    */}}
    {{- if and (eq $strategyType "RollingUpdate") .Values.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- else if and (eq $strategyType "Recreate") $existingHasRollingUpdate }}
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "tokenplace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tokenplace.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "tokenplace.fullname" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq $backend "valkey") .Values.stateBackend.valkey.tls.enabled }}
        - name: valkey-tls
          secret:
            secretName: {{ .Values.stateBackend.valkey.tls.existingSecret }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: relay
          {{- $relayPort := printf "%v" .Values.containerPort }}
          {{- $selfDispatchURL := "http://127.0.0.1:$(RELAY_PORT)" }}
          {{- $deployEnv := default "" .Values.deployEnv }}
          {{- if and (not $deployEnv) .Values.ingress.host }}
          {{- if eq .Values.ingress.host "token.place" }}
          {{- $deployEnv = "prod" }}
          {{- else if eq .Values.ingress.host "staging.token.place" }}
          {{- $deployEnv = "staging" }}
          {{- end }}
          {{- end }}
          {{- $deployEnv = default "dev" $deployEnv }}
          {{- $imageRef := .Values.image.tag }}
          {{- if .Values.image.digest }}
          {{- $imageRef = .Values.image.digest }}
          {{- end }}
          {{- $defaultEnv := dict
                "RELAY_HOST" (dict "name" "RELAY_HOST" "value" "0.0.0.0")
                "RELAY_PORT" (dict "name" "RELAY_PORT" "value" $relayPort)
                "RELAY_WORKERS" (dict "name" "RELAY_WORKERS" "value" (printf "%v" .Values.relay.workers))
                "RELAY_REPLICAS" (dict "name" "RELAY_REPLICAS" "value" (printf "%v" .Values.replicaCount))
                "RELAY_THREADS" (dict "name" "RELAY_THREADS" "value" "4")
                "TOKENPLACE_RATE_LIMIT_TRUSTED_PROXIES" (dict "name" "TOKENPLACE_RATE_LIMIT_TRUSTED_PROXIES" "value" (join "," .Values.rateLimit.trustedProxies))
                "TOKENPLACE_RELAY_INTERNAL_URL" (dict "name" "TOKENPLACE_RELAY_INTERNAL_URL" "value" $selfDispatchURL)
                "TOKENPLACE_FRONTEND_MODE" (dict "name" "TOKENPLACE_FRONTEND_MODE" "value" "production")
                "TOKENPLACE_RELEASE_VERSION" (dict "name" "TOKENPLACE_RELEASE_VERSION" "value" .Chart.AppVersion)
                "TOKENPLACE_CHART_VERSION" (dict "name" "TOKENPLACE_CHART_VERSION" "value" .Chart.Version)
                "TOKENPLACE_DEPLOY_ENV" (dict "name" "TOKENPLACE_DEPLOY_ENV" "value" $deployEnv)
                "TOKENPLACE_IMAGE_TAG" (dict "name" "TOKENPLACE_IMAGE_TAG" "value" $imageRef)
                "TOKENPLACE_RELAY_REQUIRE_UPSTREAM_HEALTH" (dict "name" "TOKENPLACE_RELAY_REQUIRE_UPSTREAM_HEALTH" "value" "0")
                "XDG_CONFIG_HOME" (dict "name" "XDG_CONFIG_HOME" "value" "/tmp/.config")
                "XDG_DATA_HOME" (dict "name" "XDG_DATA_HOME" "value" "/tmp/.local/share")
                "XDG_CACHE_HOME" (dict "name" "XDG_CACHE_HOME" "value" "/tmp/.cache")
                "XDG_STATE_HOME" (dict "name" "XDG_STATE_HOME" "value" "/tmp/.local/state")
          }}
          {{- $mergedEnv := deepCopy $defaultEnv }}
          {{- if and .Values.ingress.enabled .Values.ingress.host }}
          {{- $_ := set $mergedEnv "TOKENPLACE_RELAY_PUBLIC_URL" (dict "name" "TOKENPLACE_RELAY_PUBLIC_URL" "value" (printf "https://%s" .Values.ingress.host)) }}
          {{- end }}
          {{- if kindIs "map" .Values.env }}
          {{- range $key, $val := .Values.env }}
          {{- $name := (printf "%v" $key) }}
          {{- if kindIs "map" $val }}
          {{- $entry := deepCopy $val }}
          {{- if not (hasKey $entry "name") }}
          {{- $_ := set $entry "name" $name }}
          {{- end }}
          {{- $_ := set $mergedEnv $name $entry }}
          {{- else }}
          {{- $_ := set $mergedEnv $name (dict "name" $name "value" (printf "%v" $val)) }}
          {{- end }}
          {{- end }}
          {{- else if kindIs "slice" .Values.env }}
          {{- range $item := .Values.env }}
          {{- if and (kindIs "map" $item) (hasKey $item "name") }}
          {{- $name := (printf "%v" (get $item "name")) }}
          {{- $_ := set $mergedEnv $name (deepCopy $item) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if kindIs "slice" .Values.extraEnv }}
          {{- range $item := .Values.extraEnv }}
          {{- if and (kindIs "map" $item) (hasKey $item "name") }}
          {{- $name := (printf "%v" (get $item "name")) }}
          {{- $_ := set $mergedEnv $name (deepCopy $item) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- range $name := keys $mergedEnv }}{{- if or (hasPrefix "TOKENPLACE_RELAY_VALKEY_" $name) (eq $name "TOKENPLACE_RELAY_STATE_BACKEND") (eq $name "TOKENPLACE_ENABLE_LEGACY_RELAY_ROUTES") (eq $name "RELAY_WORKERS") (eq $name "RELAY_REPLICAS") }}{{- $_ := unset $mergedEnv $name }}{{- end }}{{- end }}
          {{- $_ := set $mergedEnv "RELAY_WORKERS" (dict "name" "RELAY_WORKERS" "value" (printf "%v" .Values.relay.workers)) }}
          {{- $_ := set $mergedEnv "RELAY_REPLICAS" (dict "name" "RELAY_REPLICAS" "value" (printf "%v" .Values.replicaCount)) }}
          {{- $_ := set $mergedEnv "TOKENPLACE_METRICS_MODE" (dict "name" "TOKENPLACE_METRICS_MODE" "value" .Values.metrics.mode) }}
          {{- $_ := set $mergedEnv "TOKENPLACE_RELAY_STATE_BACKEND" (dict "name" "TOKENPLACE_RELAY_STATE_BACKEND" "value" $backend) }}
          {{- $_ := set $mergedEnv "TOKENPLACE_ENABLE_LEGACY_RELAY_ROUTES" (dict "name" "TOKENPLACE_ENABLE_LEGACY_RELAY_ROUTES" "value" (ternary "1" "0" .Values.relay.legacyRoutesEnabled)) }}
          {{- if eq $backend "valkey" }}
          {{- $v := .Values.stateBackend.valkey }}
          {{- $plain := dict
                "DISCOVERY" $v.discovery "ENVIRONMENT" $v.environment "CLUSTER" $v.cluster
                "SCHEMA_MAJOR" $v.schema.major "READER_REVISION" $v.schema.readerRevision "WRITER_REVISION" $v.schema.writerRevision
                "SUPPORTED_SCHEMA_READ_MIN" $v.schema.supportedReadMin "SUPPORTED_SCHEMA_READ_MAX" $v.schema.supportedReadMax
                "SUPPORTED_WRITER_MIN" $v.schema.supportedWriterMin "SUPPORTED_WRITER_MAX" $v.schema.supportedWriterMax
                "ACTIVE_SCHEMA_REVISION" $v.schema.activeRevision "ACTIVE_WRITER_REVISION" $v.schema.activeWriterRevision
                "MIGRATION_EPOCH" $v.schema.migrationEpoch "CONNECT_TIMEOUT_SECONDS" $v.timeouts.connectSeconds
                "SOCKET_TIMEOUT_SECONDS" $v.timeouts.socketSeconds "COMMAND_TIMEOUT_SECONDS" $v.timeouts.commandSeconds
                "RETRY_TIMEOUT_SECONDS" $v.timeouts.retrySeconds "RETRY_ATTEMPTS" $v.retryAttempts "TLS" (ternary "true" "false" $v.tls.enabled) }}
          {{- if eq $v.discovery "direct" }}{{- $_ := set $plain "HOST" $v.direct.host }}{{- $_ := set $plain "PORT" $v.direct.port }}{{- else }}
          {{- $eps := list }}{{- range $v.sentinel.endpoints }}{{- $eps = append $eps (list .host .port) }}{{- end }}
          {{- $_ := set $plain "SENTINELS_JSON" (toJson $eps) }}{{- $_ := set $plain "SENTINEL_SERVICE" $v.sentinel.service }}{{- end }}
          {{- range $suffix, $value := $plain }}{{- $_ := set $mergedEnv (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) (dict "name" (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) "value" (printf "%v" $value)) }}{{- end }}
          {{- $_ := set $mergedEnv "TOKENPLACE_RELAY_VALKEY_ACKNOWLEDGEMENT_KEY_BASE64" (dict "name" "TOKENPLACE_RELAY_VALKEY_ACKNOWLEDGEMENT_KEY_BASE64" "valueFrom" (dict "secretKeyRef" (dict "name" $v.acknowledgementKey.existingSecret "key" $v.acknowledgementKey.secretKey))) }}
          {{- range $suffix, $key := dict "USERNAME" $v.auth.usernameKey "PASSWORD" $v.auth.passwordKey }}{{- if and $v.auth.existingSecret $key }}{{- $_ := set $mergedEnv (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) (dict "name" (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) "valueFrom" (dict "secretKeyRef" (dict "name" $v.auth.existingSecret "key" $key))) }}{{- end }}{{- end }}
          {{- range $suffix, $key := dict "SENTINEL_USERNAME" $v.sentinel.auth.usernameKey "SENTINEL_PASSWORD" $v.sentinel.auth.passwordKey }}{{- if and $v.sentinel.auth.existingSecret $key }}{{- $_ := set $mergedEnv (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) (dict "name" (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) "valueFrom" (dict "secretKeyRef" (dict "name" $v.sentinel.auth.existingSecret "key" $key))) }}{{- end }}{{- end }}
          {{- if $v.tls.enabled }}{{- range $suffix, $key := dict "TLS_CA_CERT" $v.tls.caCertKey "TLS_CLIENT_CERT" $v.tls.clientCertKey "TLS_CLIENT_KEY" $v.tls.clientKeyKey }}{{- if $key }}{{- $_ := set $mergedEnv (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) (dict "name" (printf "TOKENPLACE_RELAY_VALKEY_%s" $suffix) "value" (printf "/var/run/secrets/tokenplace/valkey-tls/%s" $key)) }}{{- end }}{{- end }}{{- end }}
          {{- end }}
          {{- if .Values.metrics.enabled }}
          {{- $metricsSecret := required "metrics.auth.existingSecret is required when metrics.enabled=true" .Values.metrics.auth.existingSecret }}
          {{- $_ := set $mergedEnv "TOKENPLACE_METRICS_TOKEN" (dict "name" "TOKENPLACE_METRICS_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" $metricsSecret "key" .Values.metrics.auth.secretKey))) }}
          {{- $_ := unset $mergedEnv "TOKENPLACE_METRICS_DISABLED" }}
          {{- else }}
          {{- $_ := unset $mergedEnv "TOKENPLACE_METRICS_TOKEN" }}
          {{- $_ := set $mergedEnv "TOKENPLACE_METRICS_DISABLED" (dict "name" "TOKENPLACE_METRICS_DISABLED" "value" "1") }}
          {{- end }}
          image: {{ include "tokenplace.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key := keys $mergedEnv | sortAlpha }}
            {{- $entry := get $mergedEnv $key }}
            - name: {{ $key }}
              {{- if and (kindIs "map" $entry) (hasKey $entry "valueFrom") }}
              valueFrom:
                {{- toYaml (get $entry "valueFrom") | nindent 16 }}
              {{- else if and (kindIs "map" $entry) (hasKey $entry "value") }}
              value: {{ get $entry "value" | quote }}
              {{- else }}
              value: ""
              {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "kill -s TERM 1 || true; sleep {{ .Values.preStop.sleepSeconds }}"
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $backend "valkey") .Values.stateBackend.valkey.tls.enabled }}
            - name: valkey-tls
              mountPath: /var/run/secrets/tokenplace/valkey-tls
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      {{- if $ha }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "tokenplace.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
