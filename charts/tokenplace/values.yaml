replicaCount: 1

strategy:
  type: Recreate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

relay:
  workers: 1
  legacyRoutesEnabled: false

# Memory is intentionally the safe single-process development default. Valkey
# consumes an externally managed direct primary or Sentinel deployment; this
# chart never installs Valkey.
stateBackend:
  type: memory
  valkey:
    discovery: direct
    direct:
      host: ""
      port: 6379
    sentinel:
      endpoints: []
      service: ""
      auth:
        existingSecret: ""
        usernameKey: username
        passwordKey: password
    environment: ""
    cluster: ""
    schema:
      major: 1
      readerRevision: 1
      writerRevision: 1
      supportedReadMin: 1
      supportedReadMax: 1
      supportedWriterMin: 1
      supportedWriterMax: 1
      activeRevision: 1
      activeWriterRevision: 1
      migrationEpoch: 1
    acknowledgementKey:
      existingSecret: ""
      secretKey: acknowledgement-key-base64
    auth:
      existingSecret: ""
      usernameKey: username
      passwordKey: password
    tls:
      enabled: false
      existingSecret: ""
      caCertKey: ca.crt
      clientCertKey: tls.crt
      clientKeyKey: tls.key
    timeouts:
      connectSeconds: 1
      socketSeconds: 2
      commandSeconds: 2
      retrySeconds: 1
    retryAttempts: 1

image:
  repository: ghcr.io/futuroptimist/tokenplace-relay
  tag: "main-latest"
  digest: ""
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

containerPort: 5010

# Public release environment label for the landing badge; blank infers from ingress.host.
deployEnv: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80

# Empty is fail-closed: forwarded identity is ignored. Operators must supply
# only the observed immediate Traefik peer CIDRs/addresses after live validation.
rateLimit:
  trustedProxies: []

metrics:
  enabled: false
  path: /metrics
  mode: normal
  auth:
    existingSecret: ""
    secretKey: token

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack
  relabelings:
    app: tokenplace
    environment: ""
    release: ""
    cluster: ""

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

env:
  XDG_CONFIG_HOME: /tmp/.config
  XDG_DATA_HOME: /tmp/.local/share
  XDG_CACHE_HOME: /tmp/.cache
  XDG_STATE_HOME: /tmp/.local/state
extraEnv: []
envFrom: []

terminationGracePeriodSeconds: 30
preStop:
  enabled: true
  sleepSeconds: 5

probes:
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
