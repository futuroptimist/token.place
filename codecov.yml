codecov:
  require_ci_to_pass: yes
# Publish both configured gates as commit statuses. Codecov's Checks-based
# publication emitted only the patch result for otherwise complete reports.
github_checks: false
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        base: auto
        informational: false
    patch:
      default:
        target: 90